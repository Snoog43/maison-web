<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison en 3D</title>
<style>
  :root { --bg:#bfd6e6; --ink:#222; --mute:#6b6760; --panel:rgba(255,255,255,.93); --line:#d9d4ca; --acc:#c2581f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1a18; --ink:#eee; --mute:#a7a29a; --panel:rgba(38,36,31,.93); --line:#3b3934; --acc:#f08a4b; } }
  :root[data-theme="dark"] { --bg:#1b1a18; --ink:#eee; --mute:#a7a29a; --panel:rgba(38,36,31,.93); --line:#3b3934; --acc:#f08a4b; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  #view { position:fixed; inset:0; }
  #view canvas { display:block; }
  .ui { position:fixed; left:16px; top:16px; max-width:calc(100vw - 32px); width:330px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; box-sizing:border-box; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .ui h1 { font-size:16px; margin:0; }
  .ui p { margin:4px 0 10px; color:var(--mute); font-size:12px; }
  .ui.folded #body { display:none; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center; }
  .row > span { font-size:12px; color:var(--mute); width:64px; }
  button { font:inherit; font-size:13px; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  #fold { padding:2px 8px; }
  label { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }
  input[type=range] { flex:1; min-width:100px; cursor:pointer; }
  .tag { font:600 12px/1.2 system-ui, sans-serif; color:#222; background:rgba(255,255,255,.88); border-radius:5px; padding:2px 6px; text-align:center; pointer-events:none; white-space:nowrap; }
  .tag small { display:block; font-weight:400; color:#555; }
  .tag.alt { font-weight:500; font-size:11px; background:rgba(255,255,240,.8); color:#5a4a20; }
  .tag.meas { background:#d0342c; color:#fff; }
  .hint, .info { position:fixed; bottom:16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; max-width:calc(50vw - 28px); box-sizing:border-box; }
  .hint { right:16px; color:var(--mute); }
  .info { left:16px; }
  .info b { display:block; font-size:13px; }
  .info code { font-size:11px; }
  .info table { border-collapse:collapse; margin:6px 0 2px; font-size:12px; }
  .info td { padding:2px 8px 2px 0; vertical-align:top; }
  .info td:last-child { text-align:right; white-space:nowrap; }
  .info tr.tot td { border-top:1px solid var(--line); font-weight:600; padding-top:4px; }
  .info a { color:inherit; }
  @media (max-width:700px){ .hint { display:none; } .info { max-width:calc(100vw - 32px); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div class="ui" id="ui">
  <div class="head"><h1>Maison en 3D</h1><button id="fold" title="Replier le panneau" aria-label="Replier le panneau">▾</button></div>
  <div id="body">
    <p>D'après le permis de construire, le plan de masse et les photos (couleurs, sols, meubles, arbres). Volumes à l'échelle ; terrain et mobilier approchés.</p>
    <div class="row" id="cuts">
      <button data-h="8" class="on">Tout</button>
      <button data-h="4.6">Chambres</button>
      <button data-h="2.6">Pièces de vie</button>
      <button data-h="1.2">Garage</button>
    </div>
    <label>Coupe <input type="range" id="cut" min="0.3" max="8" step="0.05" value="8"> <span id="cutv"></span></label>
    <div class="row"><span>Vue</span><button id="v3d">3D</button><button id="vtop">Dessus</button><button id="vterr">Terrain</button></div>
    <div class="row"><span>Outils</span><button id="bvisit">Visite</button><button id="bmeas">Mesure</button></div>
    <div class="row"><span>Afficher</span><button id="vlbl" class="on">Étiquettes</button><button id="bfurn" class="on">Meubles</button></div>
    <div class="row" style="margin:0"><span>Maison</span><button id="bdev">Domotique</button><button id="bnight">Nuit</button><button id="bseason" class="on">Automne</button></div>
    <div class="row" style="margin:8px 0 4px"><span>Soleil</span><small id="sunv" style="font-size:12px;color:var(--mute);flex:1"></small></div>
    <label>Mois <input type="range" id="smon" min="1" max="12" step="1"> <span id="smonv" style="width:46px"></span></label>
    <label style="margin:0">Heure <input type="range" id="shour" min="5" max="22" step="0.25"> <span id="shourv" style="width:46px"></span></label>
  </div>
</div>
<div class="info" id="info" hidden></div>
<div class="hint" id="hint"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// Repère du permis (cm) : x vers le nord, y vers l'est, origine = angle sud-ouest de l'aile jour.
// Three.js : X = est, Z = sud, Y = haut (m).
const W = 1352;
const P = (x, y) => [y / 100, (W - x) / 100];
const DAY = 1.27, NIGHT = 2.67, GAR = 0.05;

const view = document.getElementById('view');
const scene = new THREE.Scene();
const SKY = new THREE.Color(0xbfd6e6), DARK = new THREE.Color(0x0c1222);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(SKY.clone(), 130, 330);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true;
view.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.style.position = 'absolute'; labelR.domElement.style.inset = '0'; labelR.domElement.style.pointerEvents = 'none';
view.appendChild(labelR.domElement);

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 700);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.maxDistance = 220;

const hemi = new THREE.HemisphereLight(0xe2efff, 0xb3a78f, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(-22, 40, 30); sun.target.position.set(6, 0, 3); scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 160 });
scene.add(sun);

// coupe horizontale : s'applique à la maison, pas au terrain
const cut = new THREE.Plane(new THREE.Vector3(0, -1, 0), 8);
const CLIP = [cut];

// ---------- Textures dessinées (1 motif = 1 m) ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function tex(draw, s = 256) {
  const c = document.createElement('canvas'); c.width = c.height = s;
  draw(c.getContext('2d'), s);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
function grain(g, s, n, a) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() < .5 ? `rgba(0,0,0,${a * rnd()})` : `rgba(255,255,255,${a * rnd()})`;
    g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}
const T = {
  enduit: tex((g, s) => { g.fillStyle = '#fff'; g.fillRect(0, 0, s, s); grain(g, s, 12000, .22); }),
  beton: tex((g, s) => { g.fillStyle = '#ddd'; g.fillRect(0, 0, s, s); grain(g, s, 9000, .25); }),
  herbe: tex((g, s) => { g.fillStyle = '#eee'; g.fillRect(0, 0, s, s); grain(g, s, 20000, .35); }),
  // tuiles romanes : 5 rangs de canaux par mètre, rangées de 33 cm
  tuile: tex((g, s) => {
    const cw = s / 5, rh = s / 3;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) {
      const k = rnd(), x = c * cw, y = r * rh;
      const gr = g.createLinearGradient(x, 0, x + cw, 0);
      const base = [168 + k * 30, 84 + k * 22, 52 + k * 14];
      const sh = f => `rgb(${base.map(v => Math.round(v * f)).join(',')})`;
      gr.addColorStop(0, sh(.62)); gr.addColorStop(.5, sh(1.08)); gr.addColorStop(1, sh(.62));
      g.fillStyle = gr; g.fillRect(x, y, cw, rh);
      g.fillStyle = 'rgba(40,15,5,.35)'; g.fillRect(x, y + rh - 5, cw, 5);
    }
    grain(g, s, 3000, .12);
  }, 240),
  parquet: tex((g, s) => {
    const rh = s / 8;
    for (let r = 0; r < 8; r++) {
      let x = -rnd() * s;
      while (x < s) {
        const len = 70 + rnd() * 120, k = rnd();
        g.fillStyle = `rgb(${178 + k * 30},${130 + k * 25},${86 + k * 18})`;
        for (const o of [0, s]) g.fillRect(x - o, r * rh, len, rh);
        g.fillStyle = 'rgba(60,35,15,.5)';
        for (const o of [0, s]) g.fillRect(x - o, r * rh, 1.5, rh);
        x += len;
      }
      g.fillStyle = 'rgba(60,35,15,.45)'; g.fillRect(0, r * rh, s, 1.5);
    }
    for (let i = 0; i < 120; i++) { g.fillStyle = `rgba(90,55,25,${.08 * rnd()})`; g.fillRect(rnd() * s, rnd() * s, 20 + rnd() * 60, 1); }
  }),
  carrelage: tex((g, s) => {
    g.fillStyle = '#b9b3a8'; g.fillRect(0, 0, s, s);
    const n = 4, w = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const k = rnd() * 10; g.fillStyle = `rgb(${232 + k},${218 + k},${196 + k})`; g.fillRect(i * w + 1.5, j * w + 1.5, w - 3, w - 3); }
    grain(g, s, 2500, .08);
  }),
  dalle: tex((g, s) => {
    g.fillStyle = '#9f968a'; g.fillRect(0, 0, s, s);
    const w = s / 2;
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const k = rnd() * 16; g.fillStyle = `rgb(${214 + k},${202 + k},${180 + k})`; g.fillRect(i * w + 2, j * w + 2, w - 4, w - 4); }
    grain(g, s, 8000, .2);
  }),
  // sol des pièces de vie (photos) : grandes dalles façon pierre, pose opus
  opus: tex((g, s) => {
    g.fillStyle = '#8f8678'; g.fillRect(0, 0, s, s);
    const n = 6, u = s / n, used = [];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      if (used[j * n + i]) continue;
      let w = 1 + (rnd() < .5 && i < n - 1 && !used[j * n + i + 1] ? 1 : 0), h = 1 + (rnd() < .4 && j < n - 1 ? 1 : 0);
      for (let a = 0; a < w; a++) for (let b = 0; b < h; b++) used[(j + b) * n + i + a] = 1;
      const k = rnd() * 30 - 10;
      g.fillStyle = `rgb(${196 + k},${178 + k},${150 + k * .8})`; g.fillRect(i * u + 1.5, j * u + 1.5, w * u - 3, h * u - 3);
      for (let q = 0; q < 6; q++) { g.fillStyle = `rgba(110,85,60,${.12 * rnd()})`; g.beginPath(); g.arc(i * u + rnd() * w * u, j * u + rnd() * h * u, 4 + rnd() * 12, 0, 7); g.fill(); }
    }
    grain(g, s, 6000, .12);
  }),
  // terrasse et perron : carreaux terre cuite claire 33 cm
  terre: tex((g, s) => {
    g.fillStyle = '#b89b80'; g.fillRect(0, 0, s, s);
    const w = s / 3;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { const k = rnd() * 22; g.fillStyle = `rgb(${222 + k * .5},${178 + k},${136 + k})`; g.fillRect(i * w + 2, j * w + 2, w - 4, w - 4); }
    grain(g, s, 6000, .12);
  }),
  // tasseaux bois du bureau (lames sur feutre noir)
  lames: tex((g, s) => {
    g.fillStyle = '#141210'; g.fillRect(0, 0, s, s);
    const n = 24, w = s / n;
    for (let i = 0; i < n; i++) { const k = rnd() * 14; g.fillStyle = `rgb(${120 + k},${86 + k},${62 + k})`; g.fillRect(i * w, 0, w * .62, s); }
    for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(60,35,20,${.12 * rnd()})`; g.fillRect(rnd() * s, rnd() * s, 1, 10 + rnd() * 40); }
  }),
  marbre: tex((g, s) => {
    g.fillStyle = '#f1f0ec'; g.fillRect(0, 0, s, s);
    for (let v = 0; v < 7; v++) {
      g.strokeStyle = `rgba(120,120,125,${.15 + .25 * rnd()})`; g.lineWidth = .5 + rnd() * 1.5; g.beginPath();
      let x = rnd() * s, y = 0; g.moveTo(x, y);
      while (y < s) { x += (rnd() - .5) * 30; y += 10 + rnd() * 20; g.lineTo(x, y); }
      g.stroke();
    }
  }),
  bois: tex((g, s) => {
    g.fillStyle = '#fff'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(80,50,20,${.1 * rnd()})`; g.fillRect(rnd() * s, 0, 1, s); }
    g.fillStyle = 'rgba(40,25,10,.55)'; for (let x = 0; x < s; x += s / 8) g.fillRect(x, 0, 2, s);
  }),
};

const mat = (c, map = null, o = {}) => new THREE.MeshStandardMaterial({ color: c, map, roughness: .85, side: THREE.DoubleSide, clippingPlanes: CLIP, ...o });
const M = {
  // couleurs relevées sur les photos : enduit rose saumon, volets bleu ciel, murs intérieurs beige
  wall: mat(0xd8a48e, T.enduit), part: mat(0xeedcbf), ceil: mat(0xf7f5f0), roof: mat(0xffffff, T.tuile, { roughness: .75 }), slab: mat(0xbdb6a8, T.beton),
  parquet: mat(0xffffff, T.parquet, { roughness: .6 }), carrelage: mat(0xffffff, T.carrelage, { roughness: .4 }), garage: mat(0xf2e8dc, T.terre),
  opus: mat(0xffffff, T.opus, { roughness: .5 }), redtile: mat(0xa3141f, null, { roughness: .2 }), sdbtile: mat(0xd9b670, T.carrelage, { roughness: .25 }),
  lames: mat(0xffffff, T.lames, { roughness: .7 }), marbre: mat(0xffffff, T.marbre, { roughness: .2 }),
  stone: mat(0xffffff, T.terre), step: mat(0xffffff, T.terre), stairw: mat(0xe6d8c2, null, { roughness: .5 }), wood: mat(0xf4f2ee, null, { roughness: .4 }), gdoor: mat(0xf1efe9, T.bois),
  post: mat(0xd8a48e, T.enduit), frame: mat(0xf6f6f3, null, { roughness: .4 }), shutter: mat(0x9ccbe3, T.bois, { roughness: .5 }), genoise: mat(0xa8583a),
  glass: new THREE.MeshStandardMaterial({ color: 0xa8cbe4, transparent: true, opacity: .35, roughness: .05, metalness: .1, side: THREE.DoubleSide, depthWrite: false, clippingPlanes: CLIP }),
  // mobilier
  fabric: mat(0x667788), fabric2: mat(0xb8a084), oak: mat(0xb98a5c, null, { roughness: .6 }), white: mat(0xf2f2ef, null, { roughness: .5 }), top: mat(0x4e4640, null, { roughness: .4 }),
  dark: mat(0x232326, null, { roughness: .3 }), linen: mat(0xf5f2ec), duvet: mat(0x8fa9c4), duvet2: mat(0xd2a77c), duvet3: mat(0x9db89c), rug: mat(0xa9805c),
  metal: mat(0xbfc3c7, null, { roughness: .3, metalness: .7 }), ceram: mat(0xffffff, null, { roughness: .15 }),
  car: mat(0xf0f0ee, null, { roughness: .3, metalness: .4 }), car2: mat(0x3a3e44, null, { roughness: .3, metalness: .5 }), cglass: mat(0x24313b, null, { roughness: .1, metalness: .3 }), tire: mat(0x1c1c1c), parasol: mat(0xe9e0cc),
  brown: mat(0x4d3e37), cushion: mat(0x9fc4c9), cream: mat(0xe8dfcc), leather: mat(0xf1ece2, null, { roughness: .4 }), grey: mat(0xa49d92, null, { roughness: .5 }),
  black: mat(0x232427, null, { roughness: .4 }), navy: mat(0x2b3550), walnut: mat(0x6e5440, null, { roughness: .5 }), carton: mat(0xb8956a), teak: mat(0xc9a67a, T.bois),
  terracotta: mat(0xb8693c), pot: mat(0x3a3a3a), plant: mat(0x4e7d3a, null, { flatShading: true }), mauve: mat(0x6a4466),
  led: new THREE.MeshStandardMaterial({ color: 0xffb060, emissive: 0xff9a3c, emissiveIntensity: 2.5, clippingPlanes: CLIP }),
};

let cur = scene;
function add(m) { m.castShadow = m.receiveShadow = true; cur.add(m); return m; }

// boîte dont les coordonnées de texture suivent les mètres
function boxGeo(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const s = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * s[f][0], uv.getY(k) * s[f][1]); }
  return g;
}

// boîte depuis un rectangle du permis (cm) et une plage de hauteurs (m)
function box(x1, y1, x2, y2, h0, h1, m) {
  const X1 = y1 / 100, X2 = y2 / 100, Z1 = (W - x2) / 100, Z2 = (W - x1) / 100;
  const b = new THREE.Mesh(boxGeo(X2 - X1, h1 - h0, Z2 - Z1), m);
  b.position.set((X1 + X2) / 2, (h0 + h1) / 2, (Z1 + Z2) / 2);
  return add(b);
}

// mur le long d'un segment (repère permis), épaisseur t (cm), ouvertures [v1, v2, appui, linteau, type],
// out = direction de l'extérieur [X, Z] pour poser les volets
function wall(a, b, t, h0, h1, ops = [], m = M.wall, out = null) {
  const [ax, az] = P(...a), [bx, bz] = P(...b);
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz), r = Math.atan2(-dz, dx);
  const g = new THREE.Group();
  g.position.set(ax, 0, az); g.rotation.y = r;
  const sg = out ? Math.sign(Math.sin(r) * out[0] + Math.cos(r) * out[1]) : 0;
  const piece = (s, e, lo, hi, mm = m, th = t / 100, z = 0) => {
    if (e - s < 1e-3 || hi - lo < 1e-3) return null;
    const p = new THREE.Mesh(boxGeo(e - s, hi - lo, th), mm);
    p.position.set((s + e) / 2, (lo + hi) / 2, z); p.castShadow = mm !== M.glass; p.receiveShadow = true; g.add(p);
    return p;
  };
  const ax0 = a[0] !== b[0] ? 0 : 1;
  const list = ops.map(([v1, v2, sill, head, kind]) => {
    const s = Math.abs(v1 - a[ax0]) / 100, e = Math.abs(v2 - a[ax0]) / 100;
    return { s: Math.min(s, e), e: Math.max(s, e), sill, head, kind };
  }).sort((p, q) => p.s - q.s);
  let c = 0;
  for (const o of list) {
    piece(c, o.s, h0, h1); piece(o.s, o.e, h0, o.sill); piece(o.s, o.e, o.head, h1);
    if (o.kind === 'win') {
      piece(o.s, o.e, o.sill, o.head, M.glass, .02);
      const f = .06, ft = .08;
      piece(o.s, o.s + f, o.sill, o.head, M.frame, ft); piece(o.e - f, o.e, o.sill, o.head, M.frame, ft);
      piece(o.s + f, o.e - f, o.head - f, o.head, M.frame, ft); piece(o.s + f, o.e - f, o.sill, o.sill + f, M.frame, ft);
      if (o.e - o.s >= .9) piece((o.s + o.e) / 2 - .03, (o.s + o.e) / 2 + .03, o.sill, o.head, M.frame, ft);
      if (sg && o.e - o.s >= .8) {            // volets bois ouverts contre la façade
        const w = (o.e - o.s) / 2, z = sg * (t / 200 + .03);
        piece(o.s - w - .01, o.s - .01, o.sill, o.head, M.shutter, .04, z);
        piece(o.e + .01, o.e + w + .01, o.sill, o.head, M.shutter, .04, z);
      }
    }
    if (o.kind === 'door') piece(o.s, o.e, o.sill, o.head, M.wood, .05).userData.pass = true;
    if (o.kind === 'gdoor') piece(o.s, o.e, o.sill, o.head, M.gdoor, .06).userData.pass = true;
    c = o.e;
  }
  piece(c, L, h0, h1);
  scene.add(g);
}

// sol (polygone du permis) à la hauteur h
function floor(pts, h, m) {
  const s = new THREE.Shape(pts.map(p => { const [X, Z] = P(...p); return new THREE.Vector2(X, -Z); }));
  const f = new THREE.Mesh(new THREE.ShapeGeometry(s), m);
  f.rotation.x = -Math.PI / 2; f.position.y = h; f.receiveShadow = true; scene.add(f);
}
const R = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];

// pignon triangulaire dans le plan x = xp (permis)
function gable(xp, y1, y2, eave, ridge) {
  const s = new THREE.Shape([new THREE.Vector2(y1 / 100, eave), new THREE.Vector2(y2 / 100, eave), new THREE.Vector2((y1 + y2) / 200, ridge)]);
  const g = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: .2, bevelEnabled: false }), M.wall);
  g.position.z = (W - xp) / 100 - .1; add(g);
}

// toit deux pentes en tuiles : faîtage parallèle à l'axe nord-sud
function roof(x1, x2, y1, y2, ridgeY, ridgeH, slope = .3) {
  const Z1 = (W - x2) / 100, Z2 = (W - x1) / 100, Xr = ridgeY / 100;
  const side = (ye) => {
    const Xe = ye / 100, he = ridgeH - slope * Math.abs(Xr - Xe), sl = Math.hypot(Xr - Xe, ridgeH - he);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([Xe, he, Z1, Xr, ridgeH, Z1, Xr, ridgeH, Z2, Xe, he, Z1, Xr, ridgeH, Z2, Xe, he, Z2], 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute([Z1, sl, Z1, 0, Z2, 0, Z1, sl, Z2, 0, Z2, sl], 2));
    geo.computeVertexNormals();
    const m = add(new THREE.Mesh(geo, M.roof)); m.userData.roof = true;
  };
  side(y1); side(y2);
  const rg = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, Z2 - Z1, 10), M.genoise);   // tuiles faîtières
  rg.rotation.x = Math.PI / 2; rg.position.set(Xr, ridgeH, (Z1 + Z2) / 2); add(rg).userData.roof = true;
}

// double génoise sous l'égout, contre la façade yf (dir = -1 ouest, +1 est)
function genoise(x1, x2, yf, dir, top) {
  const ys = d => dir < 0 ? [yf - d, yf] : [yf, yf + d];
  const [a1, b1] = ys(11), [a2, b2] = ys(22);
  box(x1, a1, x2, b1, top - .30, top - .20, M.genoise);
  box(x1, a2, x2, b2, top - .20, top - .10, M.genoise);
}

// escalier : n marches de x1 à x2 (permis), montée de h0 à h1
function stairs(x1, x2, y1, y2, n, h0, h1, m = M.stairw) {
  for (let i = 0; i < n; i++) {
    const a = x1 + (x2 - x1) * i / n, b = x1 + (x2 - x1) * (i + 1) / n;
    box(Math.min(a, b), y1, Math.max(a, b), y2, GAR, h0 + (h1 - h0) * (i + 1) / n, m);
  }
}

// ---------- Terrain (plan de masse au 1/250, relevé en pixels sur le rendu à 150 dpi : 1 px = 5,85 cm) ----------
const MP = (px, py) => [(1105 - px) / 17.1, W / 100 - (py - 433) / 17.1];
const ALT = [[1425, 227, 2.5, '+2,50'], [1252, 316, 2.0, '+2,00'], [712, 773, .5, '+0,50'], [505, 1008, 0, '0,00'], [915, 650, 0, null]]
  .map(([px, py, h, txt]) => { const [X, Z] = MP(px, py); return { X, Z, h, txt }; });
const inR = (X, Z, x1, y1, x2, y2) => { const [Xa, Za] = P(x2, y1), [Xb, Zb] = P(x1, y2); return [Xa, Za, Xb, Zb]; };
// emprise de la maison, de la terrasse, de l'auvent et du perron : le sol y est au niveau du garage (façades)
const FOOT = [inR(0, 0, 0, 0, 697, 785), inR(0, 0, 697, 93, 1352, 884), inR(0, 0, -250, 0, 0, 1035), inR(0, 0, 0, 785, 697, 1035), inR(0, 0, 557, 1035, 692, 1160)];
const HOLES = FOOT.slice(0, 2);                         // sous la maison : pas de terrain (garage, vide sanitaire)
const inHole = (X, Z) => HOLES.some(([a, b, c, d]) => X > a && X < c && Z > b && Z < d);
const dRect = (X, Z, [a, b, c, d]) => Math.hypot(Math.max(a - X, 0, X - c), Math.max(b - Z, 0, Z - d));
function groundH(X, Z) {
  let s = 0, w = 0;
  for (const p of ALT) { const k = 1 / Math.pow((X - p.X) ** 2 + (Z - p.Z) ** 2 + 1, 1.3); s += k * p.h; w += k; }
  const near = Math.min(...FOOT.map(r => dRect(X, Z, r)));
  return Math.min(s / w, .12 * Math.max(0, near - 1.5));
}
const poly = pts => pts.map(([px, py]) => MP(px, py));
const ROADS = [
  poly([[470, 1170], [530, 1150], [700, 1125], [900, 1100], [1100, 1060], [1280, 1000], [1420, 910], [1490, 800], [1505, 650], [1490, 450], [1475, 300], [1495, 200], [1540, 95]]),
  poly([[332, 95], [300, 250], [270, 400], [255, 550], [268, 700], [305, 850], [355, 980], [405, 1080], [450, 1170], [470, 1170]]),
];
const ACCESS = poly([[783, 555], [950, 555], [955, 668], [870, 745], [865, 995], [875, 1085], [785, 1085]]);
const BOUND = poly([[528, 1116], [476, 1072], [336, 727], [409, 229], [1425, 227], [1448, 400], [1465, 650], [1430, 830], [1250, 960], [900, 1062], [528, 1116]]);
function dSeg(X, Z, [ax, az], [bx, bz]) {
  const vx = bx - ax, vz = bz - az, t = Math.max(0, Math.min(1, ((X - ax) * vx + (Z - az) * vz) / (vx * vx + vz * vz)));
  return Math.hypot(X - ax - t * vx, Z - az - t * vz);
}
const dLine = (X, Z, L) => { let d = 1e9; for (let i = 1; i < L.length; i++) d = Math.min(d, dSeg(X, Z, L[i - 1], L[i])); return d; };
function inPoly(X, Z, pts) {
  let ins = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    if ((zi > Z) !== (zj > Z) && X < (xj - xi) * (Z - zi) / (zj - zi) + xi) ins = !ins;
  }
  return ins;
}

// forêt de pins au sud de la parcelle, au-delà de la clôture (d'après une capture annotée)
const inForest = (X, Z) => Z > 26.8 && Z < 64 && X > -27 && X < 33 && !inPoly(X, Z, BOUND)
  && Math.min(dLine(X, Z, ROADS[0]), dLine(X, Z, ROADS[1])) > 2.2;

const tg = new THREE.PlaneGeometry(TS, TS, TN, TN); tg.rotateX(-Math.PI / 2); tg.translate(12, 0, 0);
{
  const pos = tg.attributes.position, col = new Float32Array(pos.count * 3);
  const C = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
  const grass = C(.46, .6, .32), grass2 = C(.38, .52, .27), road = C(.42, .42, .43), gravel = C(.8, .74, .63);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {

    col.set([tmp.r, tmp.g, tmp.b], i * 3);

const terrMat = new THREE.MeshStandardMaterial({ vertexColors: true, map: T.herbe, roughness: .95 });

};

// les deux voitures garées sur le gravier devant l'auvent : petite citadine blanche, SUV gris foncé
function carAt(X, Z, rot, m, L, Wd, H) {

// arcade crépie (photos) : mur plein percé d'arcs surbaissés, ouvertures [v1, v2] le long du segment
function arcade(a, b, t, h0, h1, ops, spring, top) {
  const [ax, az] = P(...a), [bx, bz] = P(...b), L = Math.hypot(bx - ax, bz - az);
  const k = a[0] !== b[0] ? 0 : 1, s = new THREE.Shape();
  s.moveTo(0, h0);
  for (const [v1, v2] of ops) {
    const p = Math.abs(v1 - a[k]) / 100, q = Math.abs(v2 - a[k]) / 100;
    s.lineTo(p, h0); s.lineTo(p, spring); s.quadraticCurveTo((p + q) / 2, 2 * top - spring, q, spring); s.lineTo(q, h0);
  }
  s.lineTo(L, h0); s.lineTo(L, h1); s.lineTo(0, h1); s.lineTo(0, h0);
  const geo = new THREE.ExtrudeGeometry(s, { depth: t / 100, bevelEnabled: false, curveSegments: 16 }); geo.translate(0, 0, -t / 200);
  const g = add(new THREE.Mesh(geo, M.wall));
  g.position.set(ax, 0, az); g.rotation.y = Math.atan2(-(bz - az), bx - ax);
}

// sous-rectangle : a = fraction de l'avant vers le dos (côté head), b = fraction latérale
function along([x1, y1, x2, y2], head, a0, a1, b0, b1) {
  const lx = t => x1 + (x2 - x1) * t, ly = t => y1 + (y2 - y1) * t;
  if (head === 'xmax') return [lx(a0), ly(b0), lx(a1), ly(b1)];
  if (head === 'xmin') return [lx(1 - a1), ly(b0), lx(1 - a0), ly(b1)];
  if (head === 'ymax') return [lx(b0), ly(a0), lx(b1), ly(a1)];
  return [lx(b0), ly(1 - a1), lx(b1), ly(1 - a0)];
}

  const H = 15 * (t + corr - 12) * Math.PI / 180;
  const sa = Math.sin(LAT) * Math.sin(dec) + Math.cos(LAT) * Math.cos(dec) * Math.cos(H), alt = Math.asin(sa);
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(LAT) - Math.tan(dec) * Math.cos(LAT)) + Math.PI; // depuis le nord, sens horaire
  const dir = new THREE.Vector3(Math.cos(alt) * Math.sin(az), sa, -Math.cos(alt) * Math.cos(az));
  sun.position.copy(sun.target.position).addScaledVector(dir, 60);
  const day = Math.max(0, Math.min(1, sa * 4 + .2)), k = Math.max(0, Math.min(1, sa * 3));
  sun.intensity = sa > 0 ? 2.4 * Math.min(1, sa * 2.5) : 0; sun.color.copy(LOWC).lerp(SUNC, k);
  hemi.intensity = .08 + 1.42 * day;
  scene.background.copy(DARK).lerp(SKY, day); scene.fog.color.copy(scene.background);
  const h0 = Math.acos(Math.max(-1, Math.min(1, -Math.tan(LAT) * Math.tan(dec)))) * 180 / Math.PI / 15;
  const azd = az * 180 / Math.PI;
  document.getElementById('smonv').textContent = MOIS[mo - 1];
  document.getElementById('shourv').textContent = hhmm(t);
  document.getElementById('sunv').textContent = (sa > 0 ? `hauteur ${Math.round(alt * 180 / Math.PI)}°, plein ${CAP[Math.round(azd / 45) % 8]}` : "sous l'horizon")
    + ` · lever ${hhmm(12 - h0 - corr)}, coucher ${hhmm(12 + h0 - corr)}`;
}
const sunInput = () => { if (isNight) document.getElementById('bnight').click(); else applySun(); };
smon.addEventListener('input', sunInput); shour.addEventListener('input', sunInput);
applySun();
tog('bnight', () => {
  isNight = !isNight;
  if (isNight) {
    scene.background.copy(DARK); scene.fog.color.copy(DARK);
    hemi.intensity = .05; sun.intensity = .12; sun.color.set(0x8da2ff);
  } else applySun();
  DEVICES.forEach(dv => dv.light && setLight(dv, isNight));
  return isNight;
});
document.getElementById('bvisit').addEventListener('click', () => mode === 'visit' ? stopVisit() : startVisit());
document.getElementById('bmeas').addEventListener('click', () => { if (mode === 'visit') stopVisit(); setMode(mode === 'meas' ? 'orbit' : 'meas'); });
document.getElementById('fold').addEventListener('click', e => {
  const f = document.getElementById('ui').classList.toggle('folded');
  e.currentTarget.textContent = f ? '▸' : '▾'; e.currentTarget.setAttribute('aria-label', f ? 'Déplier le panneau' : 'Replier le panneau');
});

function goto(p, t) { if (mode === 'visit') stopVisit(); camera.position.set(...p); controls.target.set(...t); controls.update(); }
function view3d() { camera.position.set(22, 15, 26); controls.target.set(5, 2, 6.5); controls.update(); }
document.getElementById('v3d').addEventListener('click', () => goto([22, 15, 26], [5, 2, 6.5]));
document.getElementById('vtop').addEventListener('click', () => goto([5, 26, 6.6], [5, 0, 6.5]));
document.getElementById('vterr').addEventListener('click', () => goto([46, 52, 62], [10, 0, 0]));
view3d(); setMode('orbit'); setCut(+new URLSearchParams(location.search).get('h') || 8);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (mode === 'visit') stepVisit(dt); else controls.update();
  renderer.render(scene, camera); labelR.render(scene, camera);
});
</script>
